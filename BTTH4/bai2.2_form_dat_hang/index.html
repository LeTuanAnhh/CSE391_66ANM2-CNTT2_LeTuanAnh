<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Đặt Hàng Nâng Cao - Bài 2.2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.2.1.min.js"></script>
    <script src="http://ajax.aspnetcdn.com/ajax/jquery.validate/1.9/jquery.validate.min.js"></script>
</head>
<body>

    <div class="container">
        <form id="orderForm">
            <h2>📦 Phiếu Đặt Hàng Online</h2>

            <div class="form-group">
                <label>Sản phẩm:</label>
                <select name="product" id="product">
                    <option value="">-- Chọn sản phẩm --</option>
                    <option value="Laptop">Laptop Gaming (25.000.000đ)</option>
                    <option value="Iphone">iPhone 15 Pro (28.000.000đ)</option>
                    <option value="Airpods">Airpods Pro (5.500.000đ)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Số lượng (1-99):</label>
                <input type="number" name="quantity" id="quantity" value="1">
            </div>

            <div class="form-group">
                <label>Ngày giao hàng:</label>
                <input type="date" name="deliveryDate" id="deliveryDate">
            </div>

            <div class="form-group">
                <label>Địa chỉ giao hàng:</label>
                <input type="text" name="address" placeholder="Ít nhất 10 ký tự">
            </div>

            <div class="form-group">
                <label>Phương thức thanh toán:</label>
                <div class="radio-group">
                    <input type="radio" name="payment" id="cod" value="COD"> <label class="inline" for="cod">COD</label>
                    <input type="radio" name="payment" id="bank" value="Chuyển khoản"> <label class="inline" for="bank">Chuyển khoản</label>
                    <input type="radio" name="payment" id="e-wallet" value="Ví điện tử"> <label class="inline" for="e-wallet">Ví điện tử</label>
                </div>
                <label for="payment" class="error" style="display:none;"></label>
            </div>

            <div class="form-group">
                <label>Ghi chú:</label>
                <textarea name="note" id="note" rows="3" placeholder="Tối đa 200 ký tự"></textarea>
                <div id="charCount">0/200</div>
            </div>

            <div class="total-box" id="totalContainer">
                Tổng tiền: <span id="totalPrice">0</span> VNĐ
            </div>

            <button type="submit" id="btnSubmit">Kiểm tra đơn hàng</button>
        </form>

        <div id="confirmBox" style="display: none;">
            <h3>🔍 Xác nhận đơn hàng?</h3>
            <div id="orderSummary"></div>
            <div class="confirm-buttons">
                <button id="btnFinalConfirm">Xác nhận</button>
                <button id="btnCancel" class="btn-secondary">Hủy</button>
            </div>
        </div>

        <div id="finalSuccess" style="display: none;">
            <div class="success-icon">✔️</div>
            <h2>Đặt hàng thành công!</h2>
            <p>Cảm ơn bạn đã tin dùng dịch vụ của chúng tôi.</p>
            <button onclick="location.reload()">Quay lại</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
