<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - jQuery</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.2.1.min.js"></script>
    <script src="http://ajax.aspnetcdn.com/ajax/jquery.validate/1.9/jquery.validate.min.js" type="text/javascript"></script>
</head>
<body>

    <div id="successContainer" style="display: none;">
        <h2 id="successMessage">Đăng ký thành công! 🎉 Chào mừng <span id="displayUser"></span></h2>
    </div>

    <form id="registerForm">
        <h2>Đăng Ký Tài Khoản</h2>
        
        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" name="fullname" id="fullname" placeholder="Nhập ít nhất 3 ký tự">
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" name="email" id="email" placeholder="name@domain.com">
        </div>

        <div class="form-group">
            <label>Số điện thoại:</label>
            <input type="text" name="phone" id="phone" placeholder="10 chữ số, bắt đầu bằng 0">
        </div>

        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" name="password" id="password" placeholder="≥ 8 ký tự, có hoa, thường, số">
        </div>

        <div class="form-group">
            <label>Xác nhận mật khẩu:</label>
            <input type="password" name="repassword" id="repassword" placeholder="Nhập lại mật khẩu">
        </div>

        <div class="form-group">
            <label>Giới tính:</label>
            <div class="radio-group">
                <input type="radio" name="gender" id="male" value="Nam"> <label class="inline-label" for="male">Nam</label>
                <input type="radio" name="gender" id="female" value="Nữ"> <label class="inline-label" for="female">Nữ</label>
            </div>
            <label for="gender" class="error" style="display:none;"></label>
        </div>

        <div class="form-group">
            <input type="checkbox" name="terms" id="terms">
            <label class="inline-label" for="terms">Tôi đồng ý với các điều khoản</label>
            <br>
            <label for="terms" class="error" style="display:none;"></label>
        </div>

        <button type="submit">Đăng ký</button>
    </form>

    <script src="main.js"></script>
</body>
</html>
